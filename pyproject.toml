[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Maze generator"
requires-python = ">=3.10"
authors = [
    {name = "heychong"},
    {name = "katakaha"}
]
readme = "README.md"
license = "MIT"

[tool.setuptools.packages.find]
where = ["."]
include = ["mazegen*"]